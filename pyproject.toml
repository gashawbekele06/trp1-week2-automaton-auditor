[project]
name = "automaton-auditor"
version = "0.1.0"
description = "Week 2 Automaton Auditor - LangGraph forensic swarm"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.14",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0.1",
    # PDF parsing (basic version)
    "pypdf2>=3.0.1",
    # Optional: better PDF extraction (uncomment if you add it later)
    # "docling>=1.0",
]

[tool.uv]
# Pin Python version for reproducibility
python = "3.12"